<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boutique - BOTM</title>
  <link rel="stylesheet" href="/BOTM_2.0/styles.css">

<style>
  /* Boutique — objets permanents compacts */
  .shop-quantity{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
  .shop-quantity label{font-size:.9rem}
  .shop-quantity select{padding:8px 12px;border-radius:8px;background:#171c2d;color:#fff;border:1px solid #65718d;cursor:pointer}
  .shop-quantity-total{font-size:.9rem;margin-bottom:10px;text-align:center}
  #specials{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
  }

  #specials .shop-item{
    min-width:0;
  }

  @media (max-width:650px){
    #specials{
      grid-template-columns:1fr;
    }
  }
</style>

<style>
  /* Cartes à l'unité : 3 cartes par ligne sur ordinateur */
  #cards.shop-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }

  #cards .shop-item{
    min-width:0;
  }

  #cards .card-img{
    width:100%;
    max-width:220px;
    height:auto;
    margin:0 auto;
    display:block;
  }

  @media (max-width:800px){
    #cards.shop-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
  }

  @media (max-width:520px){
    #cards.shop-grid{
      grid-template-columns:1fr;
    }
  }
</style>

<style>
  /* Centre le contenu sous chaque carte à l'unité */
  #cards .shop-item{
    text-align:center;
  }

  #cards .shop-item .meta{
    text-align:center;
  }

  #cards .shop-item button,
  #cards .shop-item .btn{
    display:block;
    width:max-content;
    margin-left:auto;
    margin-right:auto;
  }
</style>
<link rel="stylesheet" href="/BOTM_2.0/social.css">
  <link rel="stylesheet" href="/BOTM_2.0/halloween/halloween.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png" alt="BOTM">
      <div>
        <h1>🛒 Boutique</h1>
        <div class="muted">Battle of the Multiverse</div>
      </div>
    </div>
    <div class="userbox">
      <span class="badge">💠 <span data-points></span> pts</span>
      <span class="badge">🎁 <span data-boosters></span></span>
      <span class="badge">✨ <span data-miracles></span></span>
    </div>
  </div>

  <div class="nav">
    <a class="btn" href="/BOTM_2.0/index.html">← Menu</a>
  </div>

  <div id="msg" class="notice" style="display:none"></div>

  <div class="panel" style="margin-bottom:18px">
    <h2 class="section-title">Objets permanents</h2>
    <p class="muted">
      Le booster coûte 2 000 points et la Pioche Miracle 1 000 points. Choisissez un lot de 1, 5 ou 10 unités.
    </p>
    <div id="specials" class="shop-grid"></div>
  </div>

  <div class="panel">
    <h2 class="section-title">Cartes à l'unité</h2>
    <p class="muted">
      Le stock affiché est global à tous les joueurs. Une fois épuisé, personne ne peut acheter la carte.
    </p>
    <div id="cards" class="shop-grid"></div>
  </div>
</div>

<script type="module">
import { BOTM, supabase } from "/BOTM_2.0/app.js";

await BOTM.requireAuth();

let profile = await BOTM.profile();
let busy = false;

const msg = document.getElementById("msg");

function fmt(n) {
  return Number(n || 0).toLocaleString("fr-FR");
}

function showMsg(text, ok = true) {
  msg.style.display = "block";
  msg.textContent = text;
  msg.classList.toggle("shop-error", !ok);
}

function itemCard(item) {
  const d = document.createElement("div");
  d.className = "shop-item";

  let visual = "";
  let title = item.title || "";
  let subtitle = "";
  let stockText = "";

  if (item.item_type === "booster") {
    visual = "";
    title = "Booster";
    subtitle = "4 cartes aléatoires";
    stockText = "";
  } else if (item.item_type === "miracle") {
    visual = "";
    title = "Pioche Miracle";
    subtitle = "3 cartes proposées, 1 conservée";
    stockText = "";
  } else {
    const c = item.cards;
    visual = `<img class="card-img" src="${BOTM.imagePath(c)}" alt="">`;
    title = c?.file_name?.replace(/\.[^.]+$/, "") || "Carte";
    subtitle = `${c?.universe || ""} • ${BOTM.rarityLabel(c?.rarity || "")}`;
    stockText = `${item.stock ?? 0} exemplaire(s) restant(s)`;
  }

  const soldOut = item.item_type === "card" && Number(item.stock || 0) <= 0;
  const isPack = item.item_type === "booster" || item.item_type === "miracle";
  const unitPrice = Number(item.price || 0);

  d.innerHTML = `
    ${visual}
    <div class="shop-body">
      <h3>${title}</h3>
      <div class="muted small">${subtitle}</div>
      <div class="shop-price">💠 ${fmt(unitPrice)} points ${isPack ? "/ unité" : ""}</div>
      <div class="shop-stock">${soldOut ? "Épuisé" : stockText}</div>
    </div>`;

  let quantitySelect = null;
  let totalText = null;
  if (isPack) {
    const quantityRow = document.createElement("div");
    quantityRow.className = "shop-quantity";
    const label = document.createElement("label");
    label.textContent = "Quantité :";
    quantitySelect = document.createElement("select");
    quantitySelect.setAttribute("aria-label", `Quantité de ${title}`);
    for (const n of [1, 5, 10]) {
      const option = document.createElement("option");
      option.value = String(n);
      option.textContent = `× ${n}`;
      quantitySelect.appendChild(option);
    }
    label.appendChild(quantitySelect);
    quantityRow.appendChild(label);
    d.appendChild(quantityRow);
    totalText = document.createElement("div");
    totalText.className = "shop-quantity-total muted";
    d.appendChild(totalText);
  }

  const b = document.createElement("button");
  b.className = "btn gold";
  const refreshPurchaseOption = () => {
    const quantity = quantitySelect ? Number(quantitySelect.value) : 1;
    const total = unitPrice * quantity;
    const tooPoor = Number(profile.points || 0) < total;
    if (totalText) totalText.textContent = `Total : 💠 ${fmt(total)} points`;
    b.textContent = soldOut ? "Épuisé" : (tooPoor ? "Points insuffisants" : `Acheter${isPack ? ` × ${quantity}` : ""}`);
    b.disabled = busy || soldOut || tooPoor;
  };
  if (quantitySelect) quantitySelect.addEventListener("change", refreshPurchaseOption);
  b.onclick = () => buy(item, quantitySelect ? Number(quantitySelect.value) : 1);
  d.appendChild(b);
  refreshPurchaseOption();

  return d;
}

async function loadShop() {
  profile = await BOTM.profile();

  const { data, error } = await supabase
    .from("shop_items")
    .select(`
      id,
      item_type,
      title,
      price,
      stock,
      active,
      card_id,
      cards(
        id,
        universe,
        rarity,
        file_name,
        image_path
      )
    `)
    .eq("active", true)
    .order("item_type")
    .order("id");

  if (error) {
    showMsg(error.message, false);
    return;
  }

  const specials = document.getElementById("specials");
  const cards = document.getElementById("cards");
  specials.innerHTML = "";
  cards.innerHTML = "";

  (data || []).forEach(item => {
    if (item.item_type === "card") {
      cards.appendChild(itemCard(item));
    } else {
      specials.appendChild(itemCard(item));
    }
  });

  if (!cards.children.length) {
    cards.innerHTML = `<div class="muted">Aucune carte n'est actuellement proposée.</div>`;
  }

  await BOTM.refreshHeader();
}

async function buy(item, quantity = 1) {
  if (busy) return;
  const isPack = item.item_type === "booster" || item.item_type === "miracle";
  if (!isPack) quantity = 1;
  if (![1, 5, 10].includes(quantity)) return;

  const name =
    item.item_type === "booster" ? `${quantity} booster${quantity > 1 ? "s" : ""}` :
    item.item_type === "miracle" ? `${quantity} Pioche${quantity > 1 ? "s" : ""} Miracle${quantity > 1 ? "s" : ""}` :
    `la carte ${item.cards?.file_name?.replace(/\.[^.]+$/, "") || ""}`;
  const totalPrice = Number(item.price || 0) * quantity;
  if (Number(profile.points || 0) < totalPrice) {
    showMsg("Tu n'as pas assez de points pour cet achat.", false);
    return;
  }
  if (!confirm(`Acheter ${name} pour ${fmt(totalPrice)} points ?`)) return;

  busy = true;
  document.querySelectorAll(".shop-item button, .shop-quantity select").forEach(el => el.disabled = true);

  // La RPC existante achète une unité par appel : on la réutilise sans modifier le SQL.
  // En cas d'échec, les achats précédents restent acquis et sont annoncés clairement.
  let purchased = 0;
  let pointsRemaining = null;
  let purchaseError = null;
  for (let i = 0; i < quantity; i++) {
    const { data, error } = await supabase.rpc("purchase_shop_item", {
      p_item_id: item.id
    });
    if (error) {
      purchaseError = error;
      break;
    }
    purchased++;
    const result = Array.isArray(data) ? data[0] : data;
    if (result?.points_remaining != null) pointsRemaining = result.points_remaining;
  }

  busy = false;
  try {
    await loadShop();
  } catch (error) {
    console.error("Boutique : actualisation impossible", error);
  }
  if (purchaseError) {
    showMsg(
      purchased > 0
        ? `${purchased} achat(s) sur ${quantity} effectué(s). Les autres n'ont pas été débités. Erreur : ${purchaseError.message}`
        : `Achat impossible : ${purchaseError.message}`,
      false
    );
  } else {
    showMsg(
      `Achat effectué : ${name} !${pointsRemaining != null ? ` Il te reste ${fmt(pointsRemaining)} points.` : ""}`,
      true
    );
  }
}

await loadShop();
</script>
<script type="module" src="/BOTM_2.0/social.js"></script>

  <!-- Événement Halloween -->
  
  <script type="module" src="/BOTM_2.0/halloween/halloween.js"></script>
</body>
</html>
