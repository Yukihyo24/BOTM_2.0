<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Échanges - BOTM</title>
  <link rel="stylesheet" href="/BOTM_2.0/styles.css">
  <style>
    .trade-layout{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,2fr);gap:18px}
    .trade-card{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start;background:rgba(8,7,12,.92);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-bottom:14px}
    .trade-card>img{width:110px;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
    .trade-card h3{margin:0 0 4px}
    .trade-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
    .trade-actions .btn{padding:9px 12px}
    .offer-box{margin-top:12px;padding:12px;border:1px solid rgba(0,255,255,.18);border-radius:12px;background:rgba(255,255,255,.03)}
    .offer-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    .offer-row:last-child{border-bottom:0}
    .offer-cards{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .offer-card-mini{width:82px;text-align:center;font-size:.72rem}
    .offer-card-mini img{width:72px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;margin:0 auto 4px}
    .offer-resources{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .resource-chip{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.85rem}
    .status{font-size:.85rem;color:var(--gold);margin-top:6px}
    .my-card-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:510px;overflow:auto}
    .pick-card{cursor:pointer;border:2px solid transparent;border-radius:12px;padding:6px;background:rgba(8,7,12,.9)}
    .pick-card.selected{border-color:var(--accent);box-shadow:0 0 12px rgba(0,255,255,.45)}
    .pick-card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
    .pick-card .muted{font-size:.72rem}
    .offer-builder{display:none;margin-top:12px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.025)}
    .offer-builder.open{display:block}
    .builder-title{font-weight:700;margin-bottom:8px}
    .builder-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:300px;overflow:auto;padding:4px}
    .builder-card{cursor:pointer;border:2px solid transparent;border-radius:10px;padding:5px;background:rgba(8,7,12,.9);position:relative}
    .builder-card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px}
    .builder-card.selected{border-color:var(--accent)}
    .builder-card .count{position:absolute;right:8px;top:8px;background:#111;border-radius:999px;padding:3px 7px;font-weight:700}
    .builder-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .builder-fields label{display:flex;flex-direction:column;gap:5px;font-size:.85rem}
    .builder-fields input{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:inherit}
    .builder-summary{margin-top:10px;font-size:.85rem}
    @media(max-width:850px){.trade-layout{grid-template-columns:1fr}.trade-card{grid-template-columns:90px 1fr}.trade-card>img{width:90px}.builder-fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png">
      <div><h1>🔄 Échanges</h1><div class="muted">Marché entre joueurs</div></div>
    </div>
    <div class="userbox">
      <span class="badge">👤 <span data-user></span></span>
      <span class="badge">🃏 <span data-cardcount></span></span>
      <span class="badge">💠 <span data-points></span> pts</span>
    </div>
  </div>

  <div class="nav">
    <a class="btn" href="/BOTM_2.0/index.html">← Menu</a>
    <a class="btn" href="/BOTM_2.0/collection.html">🃏 Collection</a>
  </div>

  <div id="msg" class="notice" style="display:none;margin-bottom:18px"></div>

  <div class="trade-layout">
    <div class="panel">
      <h2 style="margin-top:0">Proposer une carte</h2>
      <p class="muted">Choisis une carte de ta collection à mettre sur le marché. Un exemplaire est alors réservé pour cet échange.</p>
      <div id="mycards" class="my-card-picker"></div>
      <button id="create" class="btn gold" style="width:100%;margin-top:14px" disabled>Mettre cette carte à l'échange</button>
    </div>

    <div class="panel">
      <div class="nav" style="justify-content:space-between">
        <h2 style="margin:0">Offres disponibles</h2>
        <button id="refresh" class="btn">↻ Actualiser</button>
      </div>
      <div id="market"></div>
    </div>
  </div>
</div>

<script type="module">
import { BOTM, supabase } from "/BOTM_2.0/app.js";
const session = await BOTM.requireAuth();
const uid = session.user.id;

let myCollection = [];
let selectedListingCardId = null;
const offerDrafts = new Map();

const msg = document.getElementById("msg");
function showMsg(text, error=false){
  msg.style.display = "block";
  msg.textContent = text;
  msg.style.borderColor = error ? "rgba(255,92,122,.7)" : "";
}
function cardName(c){ return String(c.file_name || "Carte").replace(/\.[^.]+$/,""); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function draftFor(listingId){
  if(!offerDrafts.has(listingId)) offerDrafts.set(listingId,{cards:[],points:0,miracle:0});
  return offerDrafts.get(listingId);
}

async function loadMyCards(){
  myCollection = await BOTM.collection();
  const wrap = document.getElementById("mycards");
  wrap.innerHTML = "";

  myCollection.forEach(row => {
    const c = row.cards;
    const d = document.createElement("div");
    d.className = "pick-card";
    d.dataset.id = c.id;
    d.innerHTML = `
      <img src="${BOTM.imagePath(c)}">
      <b>${esc(cardName(c))}</b>
      <div class="muted">${esc(BOTM.rarityLabel(c.rarity))} • ×${row.quantity}</div>
    `;
    d.onclick = () => {
      selectedListingCardId = c.id;
      document.querySelectorAll("#mycards .pick-card").forEach(x=>x.classList.remove("selected"));
      d.classList.add("selected");
      document.getElementById("create").disabled = false;
    };
    wrap.appendChild(d);
  });

  if(!myCollection.length) wrap.innerHTML = '<div class="muted">Aucune carte disponible.</div>';
}

document.getElementById("create").onclick = async () => {
  if(!selectedListingCardId) return;
  const { error } = await supabase.rpc("create_trade_listing", { p_card_id: selectedListingCardId });
  if(error){ showMsg(error.message, true); return; }
  showMsg("Carte mise à l'échange.");
  selectedListingCardId = null;
  document.getElementById("create").disabled = true;
  await loadMyCards();
  await loadMarket();
};

async function submitOffer(listingId){
  const d = draftFor(listingId);
  const points = Math.max(0, Number(d.points) || 0);
  const miracle = d.miracle ? 1 : 0;

  if(d.cards.length > 5){ showMsg("Tu peux proposer au maximum 5 cartes.", true); return; }
  if(d.cards.length === 0 && points === 0 && miracle === 0){
    showMsg("Ajoute au moins une carte, des points ou une pioche miracle.", true); return;
  }

  const { error } = await supabase.rpc("create_trade_offer", {
    p_listing_id: listingId,
    p_card_ids: d.cards,
    p_points: points,
    p_miracle_draws: miracle
  });
  if(error){ showMsg(error.message, true); return; }

  offerDrafts.delete(listingId);
  showMsg("Proposition envoyée. Tu dois encore la valider pour autoriser l'échange.");
  await loadMyCards();
  await loadMarket();
}

async function confirmOffer(offerId){
  const { data, error } = await supabase.rpc("confirm_trade_offer", { p_offer_id: offerId });
  if(error){ showMsg(error.message, true); return; }
  const done = data?.[0]?.completed;
  showMsg(done ? "✅ Échange effectué ! Cartes, points et pioches ont été transférés." : "Validation enregistrée. En attente de l'autre joueur.");
  await BOTM.refreshHeader();
  await loadMyCards();
  await loadMarket();
}

async function rejectOffer(offerId){
  if(!confirm("Refuser cette proposition ?")) return;
  const { error } = await supabase.rpc("reject_trade_offer", { p_offer_id: offerId });
  if(error){ showMsg(error.message, true); return; }
  showMsg("Proposition refusée.");
  await loadMarket();
}

async function cancelOffer(offerId){
  if(!confirm("Annuler ta proposition ?")) return;
  const { error } = await supabase.rpc("cancel_trade_offer", { p_offer_id: offerId });
  if(error){ showMsg(error.message, true); return; }
  showMsg("Proposition annulée.");
  await loadMarket();
}

async function cancelListing(listingId){
  if(!confirm("Retirer cette carte du marché ? Les propositions en cours seront annulées.")) return;
  const { error } = await supabase.rpc("cancel_trade_listing", { p_listing_id: listingId });
  if(error){ showMsg(error.message, true); return; }
  showMsg("Annonce retirée.");
  await loadMyCards();
  await loadMarket();
}

async function loadOffers(listingId, holder){
  holder.innerHTML = '<div class="muted">Chargement des propositions...</div>';
  const { data, error } = await supabase.rpc("get_trade_listing_offers", { p_listing_id: listingId });
  if(error){ holder.innerHTML = `<div class="muted">${esc(error.message)}</div>`; return; }

  holder.innerHTML = "";
  (data || []).forEach(o => {
    const row = document.createElement("div");
    row.className = "offer-row";

    const cards = Array.isArray(o.cards) ? o.cards : [];
    const cardsHtml = cards.length ? cards.map(c => `
      <div class="offer-card-mini">
        <img src="${BOTM.imagePath(c)}">
        <div>${esc(cardName(c))}${Number(c.quantity) > 1 ? ` ×${Number(c.quantity)}` : ""}</div>
      </div>
    `).join("") : '<span class="muted">Aucune carte</span>';

    const resources = [];
    if(Number(o.offered_points) > 0) resources.push(`<span class="resource-chip">💠 ${Number(o.offered_points).toLocaleString("fr-FR")} points</span>`);
    if(Number(o.offered_miracle_draws) > 0) resources.push('<span class="resource-chip">✨ 1 pioche miracle</span>');

    row.innerHTML = `
      <div><b>${esc(o.proposer_username)}</b> propose :</div>
      <div class="offer-cards">${cardsHtml}</div>
      ${resources.length ? `<div class="offer-resources">${resources.join("")}</div>` : ""}
      <div class="status">
        Proposant : ${o.proposer_confirmed ? "✅ validé" : "⏳ à valider"}
        &nbsp; • &nbsp;
        Propriétaire : ${o.owner_confirmed ? "✅ validé" : "⏳ à valider"}
      </div>
      <div class="trade-actions"></div>
    `;

    const actions = row.querySelector(".trade-actions");
    if(o.can_confirm){
      const b = document.createElement("button");
      b.className = "btn gold";
      b.textContent = "✅ Valider l'échange";
      b.onclick = () => confirmOffer(o.offer_id);
      actions.appendChild(b);
    }
    if(o.can_reject){
      const b = document.createElement("button");
      b.className = "btn danger";
      b.textContent = "Refuser";
      b.onclick = () => rejectOffer(o.offer_id);
      actions.appendChild(b);
    }
    if(o.can_cancel){
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = "Annuler";
      b.onclick = () => cancelOffer(o.offer_id);
      actions.appendChild(b);
    }
    holder.appendChild(row);
  });

  if(!(data||[]).length) holder.innerHTML = '<div class="muted">Aucune proposition pour le moment.</div>';
}

function buildOfferBuilder(listingId, holder){
  const d = draftFor(listingId);
  holder.innerHTML = `
    <div class="builder-title">Composer mon offre <span class="muted">(maximum 5 cartes)</span></div>
    <div class="builder-cards"></div>
    <div class="builder-fields">
      <label>💠 Points
        <input class="offer-points" type="number" min="0" step="1" value="${Number(d.points)||0}" placeholder="0">
      </label>
      <label>✨ Pioche miracle
        <span style="padding:10px 0"><input class="offer-miracle" type="checkbox" ${d.miracle ? "checked" : ""}> Ajouter 1 pioche miracle</span>
      </label>
    </div>
    <div class="builder-summary muted"></div>
    <div class="trade-actions">
      <button class="btn gold send-offer">Envoyer cette offre</button>
      <button class="btn close-builder">Fermer</button>
    </div>
  `;

  const grid = holder.querySelector(".builder-cards");
  const summary = holder.querySelector(".builder-summary");

  function renderCards(){
    grid.innerHTML = "";
    myCollection.forEach(r => {
      const c = r.cards;
      const selectedCount = d.cards.filter(id => Number(id) === Number(c.id)).length;
      const el = document.createElement("div");
      el.className = "builder-card" + (selectedCount ? " selected" : "");
      el.innerHTML = `
        <img src="${BOTM.imagePath(c)}">
        ${selectedCount ? `<span class="count">×${selectedCount}</span>` : ""}
        <div>${esc(cardName(c))}</div>
        <div class="muted">${esc(BOTM.rarityLabel(c.rarity))} • possédé ×${r.quantity}</div>
      `;
      el.onclick = () => {
        const current = d.cards.filter(id => Number(id) === Number(c.id)).length;
        if(current > 0){
          const idx = d.cards.findIndex(id => Number(id) === Number(c.id));
          d.cards.splice(idx,1);
        } else {
          if(d.cards.length >= 5){ showMsg("Maximum 5 cartes par offre.", true); return; }
          d.cards.push(Number(c.id));
        }
        renderCards();
        updateSummary();
      };
      // Shift/clic n'est pas nécessaire : un clic ajoute 1 exemplaire, puis le clic suivant le retire.
      // Pour proposer plusieurs exemplaires identiques, utiliser le bouton + créé ci-dessous.
      if(Number(r.quantity) > 1){
        const plus = document.createElement("button");
        plus.className = "btn";
        plus.type = "button";
        plus.textContent = "+1";
        plus.style.marginTop = "5px";
        plus.onclick = ev => {
          ev.stopPropagation();
          const current = d.cards.filter(id => Number(id) === Number(c.id)).length;
          if(d.cards.length >= 5){ showMsg("Maximum 5 cartes par offre.", true); return; }
          if(current >= Number(r.quantity)){ showMsg("Tu n'en possèdes pas davantage.", true); return; }
          d.cards.push(Number(c.id));
          renderCards();
          updateSummary();
        };
        el.appendChild(plus);
      }
      grid.appendChild(el);
    });
  }

  function updateSummary(){
    const pts = Math.max(0, Number(holder.querySelector(".offer-points").value)||0);
    const mir = holder.querySelector(".offer-miracle").checked;
    d.points = pts;
    d.miracle = mir ? 1 : 0;
    summary.textContent = `${d.cards.length}/5 carte(s) • ${pts.toLocaleString("fr-FR")} point(s)${mir ? " • 1 pioche miracle" : ""}`;
  }

  holder.querySelector(".offer-points").oninput = updateSummary;
  holder.querySelector(".offer-miracle").onchange = updateSummary;
  holder.querySelector(".send-offer").onclick = () => { updateSummary(); submitOffer(listingId); };
  holder.querySelector(".close-builder").onclick = () => holder.classList.remove("open");

  renderCards();
  updateSummary();
}

async function loadMarket(){
  const market = document.getElementById("market");
  market.innerHTML = '<div class="muted">Chargement...</div>';

  const { data, error } = await supabase.rpc("get_trade_market");
  if(error){ market.innerHTML = `<div class="muted">${esc(error.message)}</div>`; return; }

  market.innerHTML = "";
  (data || []).forEach(l => {
    const box = document.createElement("div");
    box.className = "trade-card";
    box.innerHTML = `
      <img src="${BOTM.imagePath(l)}">
      <div>
        <h3>${esc(l.file_name.replace(/\.[^.]+$/, ""))}</h3>
        <div class="rarity">${esc(l.universe)} • ${esc(BOTM.rarityLabel(l.rarity))}</div>
        <div class="muted">Proposée par <b>${esc(l.owner_username)}</b></div>
        <div class="trade-actions"></div>
        <div class="offer-builder"></div>
        <div class="offer-box" style="display:none"></div>
      </div>
    `;

    const actions = box.querySelector(".trade-actions");
    const offersHolder = box.querySelector(".offer-box");
    const builder = box.querySelector(".offer-builder");

    const view = document.createElement("button");
    view.className = "btn";
    view.textContent = "Voir les propositions";
    view.onclick = async () => {
      const open = offersHolder.style.display !== "none";
      offersHolder.style.display = open ? "none" : "block";
      if(!open) await loadOffers(l.listing_id, offersHolder);
    };
    actions.appendChild(view);

    if(l.is_mine){
      const cancel = document.createElement("button");
      cancel.className = "btn danger";
      cancel.textContent = "Retirer mon annonce";
      cancel.onclick = () => cancelListing(l.listing_id);
      actions.appendChild(cancel);
    } else {
      const propose = document.createElement("button");
      propose.className = "btn gold";
      propose.textContent = "Composer une offre";
      propose.onclick = () => {
        if(!builder.innerHTML) buildOfferBuilder(l.listing_id, builder);
        builder.classList.toggle("open");
      };
      actions.appendChild(propose);
    }

    market.appendChild(box);
  });

  if(!(data||[]).length){
    market.innerHTML = '<div class="muted">Aucune carte n’est actuellement proposée à l’échange.</div>';
  }
}

document.getElementById("refresh").onclick = async () => {
  offerDrafts.clear();
  await loadMyCards();
  await loadMarket();
};

await BOTM.refreshHeader();
await loadMyCards();
await loadMarket();
</script>
</body>
</html>
