<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection - BOTM</title><link rel="stylesheet" href="styles.css"></head><body><div class="app">
<div class="topbar"><div class="brand"><img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png"><div><h1>Ma collection</h1></div></div><div class="userbox"><span class="badge">👤 <span data-user></span></span><span class="badge">🃏 <span data-cardcount></span></span></div></div>
<div class="nav"><a class="btn" href="index.html">← Menu</a></div>
<div class="panel"><div class="nav"><select id="universe" class="btn"><option value="">Tous les univers</option></select><select id="rarity" class="btn"><option value="">Toutes les raretés</option><option value="commune">Commune</option><option value="rare">Rare</option><option value="super_rare">Super Rare</option><option value="tres_rare">Très Rare</option><option value="ultra_rare">Ultra Rare</option></select></div><div id="cards" class="cards"></div></div>
</div>
<script type="module">
import { BOTM } from "./app.js";
await BOTM.requireAuth();
const u=document.getElementById("universe");BOTM.universes.forEach(x=>u.add(new Option(x,x)));
async function render(){
 const uf=u.value,rf=document.getElementById("rarity").value;const rows=await BOTM.collection();const wrap=document.getElementById("cards");wrap.innerHTML="";
 const filtered=rows.filter(r=>(!uf||r.cards.universe===uf)&&(!rf||r.cards.rarity===rf));
 filtered.forEach(r=>{const c=r.cards;const d=document.createElement("div");d.className="card-item";d.innerHTML=`<span class="qty">×${r.quantity}</span><img class="card-img" src="${BOTM.imagePath(c)}"><div class="meta"><b>${c.file_name.replace(/\.[^.]+$/,"")}</b><div class="rarity">${c.universe} • ${BOTM.rarityLabel(c.rarity)}</div></div>`;wrap.appendChild(d)});
 if(!filtered.length)wrap.innerHTML='<div class="muted">Aucune carte.</div>';
}
u.onchange=render;document.getElementById("rarity").onchange=render;await render();
</script></body></html>
