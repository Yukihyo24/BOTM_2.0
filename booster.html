<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boosters - BOTM</title><link rel="stylesheet" href="/BOTM_2.0/styles.css"></head><body><div class="app">
<div class="topbar"><div class="brand"><img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png"><div><h1>Ouverture de booster</h1></div></div><span class="badge">🎁 <span data-boosters></span> booster(s)</span></div>
<div class="nav"><a class="btn" href="/BOTM_2.0/index.html">← Menu</a></div><div class="panel"><h2>Choisir l'univers</h2><p class="muted">Le serveur consomme 1 booster et tire 4 cartes dans l'univers choisi.</p><div id="univers" class="univers-grid"></div><button id="open" class="btn gold" disabled>Ouvrir</button><div id="msg" class="notice" style="display:none"></div><div id="cards" class="reveal-wrap"></div><audio id="audio" src="/BOTM_2.0/booster.mp3" preload="auto"></audio></div>
</div>
<script type="module">
import { BOTM, supabase } from "/BOTM_2.0/app.js";await BOTM.requireAuth();let selected=null;
const u=document.getElementById("univers");BOTM.universes.forEach(name=>{const img=document.createElement("img");img.src=`/BOTM_2.0/assets/univers/${name}.jpg`;img.className="univers-img";img.title=name;img.onclick=()=>{selected=name;document.querySelectorAll(".univers-img").forEach(x=>x.classList.remove("selected"));img.classList.add("selected");document.getElementById("open").disabled=false};u.appendChild(img)});
document.getElementById("open").onclick=async()=>{const b=document.getElementById("open");b.disabled=true;const m=document.getElementById("msg");m.style.display="block";m.textContent="Ouverture...";
try{const a=document.getElementById("audio");a.currentTime=0;a.play().catch(()=>{})}catch{}
const {data,error}=await supabase.rpc("open_booster",{p_universe:selected});if(error){m.textContent=error.message;b.disabled=false;return;}
const w=document.getElementById("cards");w.innerHTML="";(data||[]).forEach((c,i)=>setTimeout(()=>{const d=document.createElement("div");d.className="card-item reveal";d.innerHTML=`<img class="card-img" src="${BOTM.imagePath(c)}"><div class="meta"><b>${c.file_name.replace(/\.[^.]+$/,"")}</b><div class="rarity">${BOTM.rarityLabel(c.rarity)}</div></div>`;w.appendChild(d)},i*140));m.textContent="Cartes ajoutées à ta collection.";await BOTM.refreshHeader();b.disabled=false;};
</script></body></html>
