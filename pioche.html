<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pioche Miracle - BOTM</title><link rel="stylesheet" href="styles.css">
<style>
body{overflow-x:hidden}.panel{min-height:720px;position:relative;overflow:hidden}.miracle-intro{text-align:center;margin:0 auto 12px;max-width:760px}
#univers{position:relative;height:510px;max-width:1380px;margin:0 auto;display:block}
.miracle-card{position:absolute;left:50%;top:18px;width:270px;height:432px;object-fit:contain;transform-origin:center;transition:transform .42s ease,opacity .42s ease,filter .42s ease;cursor:pointer;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 18px 28px rgba(0,0,0,.42))}
.miracle-card.pos-0{transform:translateX(-50%) scale(1.04);z-index:5;opacity:1}.miracle-card.pos--1{transform:translateX(calc(-50% - 330px)) scale(.80);z-index:4;opacity:.78}.miracle-card.pos-1{transform:translateX(calc(-50% + 330px)) scale(.80);z-index:4;opacity:.78}.miracle-card.pos--2{transform:translateX(calc(-50% - 570px)) scale(.57);z-index:3;opacity:.30}.miracle-card.pos-2{transform:translateX(calc(-50% + 570px)) scale(.57);z-index:3;opacity:.30}.miracle-card.hidden-card{opacity:0;pointer-events:none;transform:translateX(-50%) scale(.35)}
.carousel-arrow{position:absolute;top:205px;z-index:10;width:54px;height:54px;border-radius:50%;border:1px solid rgba(148,163,184,.35);background:rgba(7,12,38,.88);color:#fff;font-size:34px;line-height:48px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}.carousel-arrow:hover{transform:scale(1.06)}#prev-universe{left:7%}#next-universe{right:7%}
#selected-universe{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);min-width:170px;text-align:center;font-size:24px;font-weight:800;padding:10px 18px;border-radius:10px;background:rgba(5,10,35,.72)}
#draw-action{text-align:center;margin:18px 0 6px}#draw-action .btn{font-size:18px;padding:12px 24px}#msg{max-width:720px;margin:16px auto;text-align:center}
#cards.reveal-wrap{grid-template-columns:repeat(3,minmax(0,220px));justify-content:center;align-items:start;gap:18px}#cards .card-item{width:100%;max-width:220px;justify-self:center}#cards .card-item img.card-img{width:100%;max-width:204px;margin:0 auto;display:block}#cards .card-item:only-child{max-width:200px;grid-column:1/-1;justify-self:center}#cards .card-item:only-child img.card-img{max-width:184px}
#cards.chosen-card{display:flex!important;justify-content:center!important;align-items:flex-start;width:100%}#cards.chosen-card .card-item{flex:0 0 200px;width:200px;max-width:200px;margin:0 auto}#cards.chosen-card .card-item img.card-img{width:184px;max-width:184px}
@media(max-width:760px){.panel{min-height:650px}#univers{height:430px}.miracle-card{width:220px;height:352px}.miracle-card.pos--1{transform:translateX(calc(-50% - 205px)) scale(.72)}.miracle-card.pos-1{transform:translateX(calc(-50% + 205px)) scale(.72)}.miracle-card.pos--2,.miracle-card.pos-2{opacity:0;pointer-events:none}.carousel-arrow{top:165px;width:46px;height:46px;font-size:28px}#prev-universe{left:2%}#next-universe{right:2%}#cards.reveal-wrap{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#cards .card-item,#cards .card-item:only-child{max-width:180px}#cards .card-item img.card-img,#cards .card-item:only-child img.card-img{max-width:164px}}
@media(max-width:520px){#univers{height:385px}.miracle-card{width:205px;height:328px}.miracle-card.pos--1,.miracle-card.pos-1{opacity:.18}#selected-universe{font-size:19px;bottom:0}#cards.reveal-wrap{grid-template-columns:1fr}#cards .card-item{max-width:190px}#cards .card-item img.card-img{max-width:174px}#cards .card-item:only-child{max-width:180px}#cards .card-item:only-child img.card-img{max-width:164px}}

  /* Révélation Pioche Miracle : flash blanc + cartes superposées à la sélection */
  #miracle-reveal-overlay{
    position:fixed;inset:0;z-index:10000;display:none;
    align-items:center;justify-content:center;
    background:rgba(4,8,30,.82);
    backdrop-filter:blur(7px);
  }
  #miracle-reveal-overlay.active{display:flex}
  #miracle-reveal-overlay::before{
    content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  }
  #miracle-reveal-overlay.flash::before{animation:miracleWhiteFlash .9s ease-out}
  @keyframes miracleWhiteFlash{
    0%{opacity:0}18%{opacity:1}42%{opacity:.92}100%{opacity:0}
  }
  #miracle-reveal-stage{
    position:relative;z-index:2;width:min(920px,94vw);min-height:520px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  #miracle-reveal-title{
    margin:0 0 22px;text-align:center;font-size:22px;font-weight:800;color:#fff;
    text-shadow:0 0 18px rgba(255,255,255,.35);
  }
  #miracle-overlay-cards{
    width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,220px));
    justify-content:center;align-items:start;gap:24px;
  }
  #miracle-overlay-cards .card-item{
    width:100%;max-width:220px;justify-self:center;
    animation:miracleCardAppear .55s cubic-bezier(.2,.8,.2,1) both;
  }
  #miracle-overlay-cards .card-item:nth-child(2){animation-delay:.10s}
  #miracle-overlay-cards .card-item:nth-child(3){animation-delay:.20s}
  #miracle-overlay-cards .card-img{width:100%;max-width:204px;margin:0 auto;display:block}
  @keyframes miracleCardAppear{
    from{opacity:0;transform:translateY(24px) scale(.72);filter:brightness(2.4) blur(5px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:brightness(1) blur(0)}
  }
  #miracle-overlay-cards.chosen-card{display:flex!important;justify-content:center!important}
  #miracle-overlay-cards.chosen-card .card-item{flex:0 0 220px;max-width:220px}
  #miracle-overlay-cards.chosen-card .card-img{max-width:204px}
  @media(max-width:700px){
    #miracle-reveal-stage{min-height:440px}
    #miracle-overlay-cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 8px}
    #miracle-overlay-cards .card-item{max-width:180px}
    #miracle-overlay-cards .card-img{max-width:164px}
  }
  @media(max-width:520px){
    #miracle-reveal-stage{justify-content:flex-start;padding-top:55px;max-height:94vh;overflow:auto}
    #miracle-overlay-cards{grid-template-columns:1fr}
    #miracle-overlay-cards .card-item{max-width:190px}
    #miracle-overlay-cards .card-img{max-width:174px}
  }


  /* Badge de rareté identique au principe utilisé sur les boosters */
  #miracle-overlay-cards .miracle-card-visual{
    position:relative;
    width:100%;
    max-width:204px;
    margin:0 auto;
  }
  #miracle-overlay-cards .miracle-card-visual .card-img{
    width:100%;max-width:none;margin:0;display:block;
  }
  #miracle-overlay-cards .badge-rarete{
    position:absolute;
    right:8px;
    bottom:8px;
    width:42px;
    height:42px;
    object-fit:contain;
    z-index:5;
    pointer-events:none;
    animation:miracleRarityPop .58s .28s cubic-bezier(.2,.9,.25,1.25) both;
  }
  #miracle-overlay-cards .badge-rarete[src*="ultra_rare"]{
    filter:drop-shadow(0 0 9px #6fffff);
  }
  #miracle-overlay-cards .badge-rarete[src*="tres_rare"],
  #miracle-overlay-cards .badge-rarete[src*="super_rare"]{
    filter:drop-shadow(0 0 9px #ffff51);
  }
  #miracle-overlay-cards .badge-rarete[src*="rare"],
  #miracle-overlay-cards .badge-rarete[src*="commune"]{
    filter:drop-shadow(0 0 8px #4b69a0);
  }
  @keyframes miracleRarityPop{
    0%{opacity:0;transform:scale(0) rotate(-18deg)}
    70%{opacity:1;transform:scale(1.18) rotate(3deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }
  @media(max-width:700px){
    #miracle-overlay-cards .miracle-card-visual{max-width:164px}
    #miracle-overlay-cards .badge-rarete{width:34px;height:34px;right:6px;bottom:6px}
  }
  @media(max-width:520px){
    #miracle-overlay-cards .miracle-card-visual{max-width:174px}
  }


  #miracle-reveal-close{
    display:none;
    margin-top:22px;
    padding:11px 22px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:10px;
    background:rgba(10,16,48,.92);
    color:#fff;
    font:inherit;
    font-weight:700;
    cursor:pointer;
  }
  #miracle-reveal-close:hover{background:rgba(24,34,78,.98)}
  #miracle-reveal-overlay.result-done #miracle-reveal-close{display:inline-flex}

</style>
<link rel="stylesheet" href="/BOTM_2.0/social.css">
</head><body><div class="app">
<div class="topbar"><div class="brand"><img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png"><div><h1>✨ Pioche Miracle</h1></div></div><span class="badge">✨ <span data-miracles></span></span></div>
<div class="nav"><a class="btn" href="index.html">← Menu</a></div><div class="panel">
<p class="miracle-intro">Choisis l’univers de ta Pioche Miracle. Une seule sélection persistante de 3 cartes sera générée : recharger la page ne permet pas de relancer le tirage.</p>
<div id="univers"><button id="prev-universe" class="carousel-arrow" type="button">‹</button><button id="next-universe" class="carousel-arrow" type="button">›</button><div id="selected-universe"></div></div>
<div id="draw-action"><button id="start-draw" class="btn gold" type="button">Lancer la Pioche Miracle</button></div><div id="msg" class="notice" style="display:none"></div><div id="cards" class="reveal-wrap"></div></div>
</div>
<div id="miracle-reveal-overlay" aria-hidden="true">
  <div id="miracle-reveal-stage">
    <div id="miracle-reveal-title">Choisis une carte</div>
    <div id="miracle-overlay-cards" class="reveal-wrap"></div>
    <button id="miracle-reveal-close" type="button">Fermer</button>
  </div>
</div>
<script type="module">
import { BOTM, supabase } from "./app.js";await BOTM.requireAuth();let sessionId=null;
const miracleImages={"Animes Divers":"assets/miracles/Animes Divers.png","Catch":"assets/miracles/Catch.png","DBZ":"assets/miracles/DBZ.png","Jeux-Videos":"assets/miracles/Jeux-Videos.png","Naruto":"assets/miracles/Naruto.png","One Piece":"assets/miracles/One Piece.png","Pokemon":"assets/miracles/Pokemon.png","Super Heros":"assets/miracles/Super Heros.png","Television":"assets/miracles/Television.png"};
const availableUniverses=BOTM.universes.filter(name=>miracleImages[name]),u=document.getElementById("univers"),label=document.getElementById("selected-universe");let currentIndex=0;
const miracleCards=availableUniverses.map((name,index)=>{const img=document.createElement("img");img.src=miracleImages[name];img.alt=name;img.title=name;img.className="miracle-card";img.onclick=()=>{currentIndex=index;renderCarousel()};u.appendChild(img);return img});
function circularDistance(i,c,t){let d=i-c;if(d>t/2)d-=t;if(d<-t/2)d+=t;return d}
function renderCarousel(){const total=availableUniverses.length;miracleCards.forEach((img,index)=>{const d=circularDistance(index,currentIndex,total);img.className="miracle-card";if(d>=-2&&d<=2)img.classList.add(`pos-${d}`);else img.classList.add("hidden-card")});label.textContent=availableUniverses[currentIndex]||""}
function moveCarousel(step){if(!availableUniverses.length)return;currentIndex=(currentIndex+step+availableUniverses.length)%availableUniverses.length;renderCarousel()}
document.getElementById("prev-universe").onclick=()=>moveCarousel(-1);document.getElementById("next-universe").onclick=()=>moveCarousel(1);document.getElementById("start-draw").onclick=()=>{const name=availableUniverses[currentIndex];if(name)start(name)};renderCarousel();
async function start(name){const m=document.getElementById("msg");m.style.display="block";m.textContent="Tirage...";
const {data,error}=await supabase.rpc("start_miracle_draw",{p_universe:name});if(error){m.textContent=error.message;return;}sessionId=data[0]?.session_id;render(data);m.textContent="Choisis une carte : ce choix est définitif.";}
function render(rows){
  const overlay=document.getElementById("miracle-reveal-overlay");
  const w=document.getElementById("miracle-overlay-cards");
  const title=document.getElementById("miracle-reveal-title");
  document.getElementById("cards").innerHTML="";
  w.innerHTML="";
  const chosen=(rows||[]).length===1;
  w.classList.toggle("chosen-card",chosen);
  title.textContent=chosen?"Carte obtenue !":"Choisis une carte";
  overlay.classList.toggle("result-done",chosen);
  (rows||[]).forEach(c=>{
    const d=document.createElement("div");d.className="card-item reveal";
    d.innerHTML=`<div class="miracle-card-visual"><img class="card-img" src="${BOTM.imagePath(c)}"><img class="badge-rarete" src="assets/raretes/${c.rarity}.png" alt="${BOTM.rarityLabel(c.rarity)}"></div><div class="meta"><b>${c.file_name.replace(/\.[^.]+$/,"")}</b><div class="rarity">${BOTM.rarityLabel(c.rarity)}</div></div>`;
    if(!chosen){const b=document.createElement("button");b.className="btn gold";b.textContent="Choisir";b.onclick=()=>choose(c.card_id);d.appendChild(b);}
    w.appendChild(d);
  });
  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden","false");
  if(!chosen){
    overlay.classList.remove("flash");
    void overlay.offsetWidth;
    overlay.classList.add("flash");
  }
}
document.getElementById("miracle-reveal-close").onclick=()=>{
  const overlay=document.getElementById("miracle-reveal-overlay");
  overlay.classList.remove("active","flash","result-done");
  overlay.setAttribute("aria-hidden","true");
};

async function choose(cardId){const {data,error}=await supabase.rpc("choose_miracle_card",{p_session_id:sessionId,p_card_id:cardId});const m=document.getElementById("msg");if(error){m.textContent=error.message;return;}render(data);document.querySelectorAll("#miracle-overlay-cards button").forEach(b=>b.remove());m.textContent="Carte ajoutée à ta collection !";await BOTM.refreshHeader();}
</script><script type="module" src="/BOTM_2.0/social.js"></script>
</body></html>
