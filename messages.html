<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages privés - BOTM</title><link rel="stylesheet" href="/BOTM_2.0/styles.css"><link rel="stylesheet" href="/BOTM_2.0/social.css"></head>
<body class="social-page"><div class="social-wrap">
<header class="social-top"><div><div class="muted small">BATTLE OF THE MULTIVERSE</div><h1>Messages privés</h1></div>
<nav class="social-nav"><a href="/BOTM_2.0/index.html">← Accueil</a><a href="/BOTM_2.0/profil.html">Mon profil</a><a href="/BOTM_2.0/communaute.html">Communauté</a></nav></header>
<section class="social-panel messages-layout">
 <aside class="conversation-list" id="conversationList"></aside>
 <main class="conversation-main">
   <div class="conversation-head" id="conversationHead">Choisis une conversation.</div>
   <div class="message-stream" id="messageStream"></div>
   <form class="message-form" id="messageForm" style="display:none"><textarea id="messageInput" maxlength="2000" placeholder="Écrire un message…"></textarea><button class="sbtn primary">Envoyer</button></form>
 </main>
</section></div>
<script type="module">
import {BOTM,supabase} from "/BOTM_2.0/app.js";
await BOTM.requireAuth();await supabase.rpc("touch_presence");
const {data:{session}}=await supabase.auth.getSession();const me=session.user.id;
const fallback="/BOTM_2.0/assets/botm-logo-mark.png";const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let current=new URLSearchParams(location.search).get("id")||null;let currentProfile=null;
async function conversations(){
 const {data,error}=await supabase.rpc("get_conversations");if(error){console.error(error);return}
 const rows=data||[];
 document.getElementById("conversationList").innerHTML=rows.map(c=>`<div class="conversation-item ${current===c.user_id?"active":""}" data-id="${c.user_id}">
 <img class="avatar-50" src="${esc(c.avatar_url||fallback)}"><div class="grow"><b>${esc(c.username)}</b><div class="preview">${esc(c.last_message||"")}</div></div>${Number(c.unread_count)>0?`<span class="unread">${c.unread_count}</span>`:""}</div>`).join("")||"<p style='color:#95a1c5;padding:10px'>Aucune conversation.</p>";
 document.querySelectorAll(".conversation-item").forEach(x=>x.onclick=()=>openConversation(x.dataset.id));
}
async function openConversation(id){
 current=id;history.replaceState(null,"",`?id=${encodeURIComponent(id)}`);
 const {data:p,error:pe}=await supabase.rpc("get_public_profile",{p_user_id:id});if(pe){alert(pe.message);return}currentProfile=p;
 document.getElementById("conversationHead").innerHTML=`<a href="/BOTM_2.0/profil.html?id=${id}"><img class="avatar-50" src="${esc(p.avatar_url||fallback)}"></a><div><b>${esc(p.username)}</b><div style="color:#95a1c5;font-size:.75rem">${p.online?"En ligne":"Hors ligne"}</div></div>`;
 document.getElementById("messageForm").style.display="flex";
 await supabase.rpc("mark_private_messages_read",{p_other:id});
 await loadMessages();await conversations();
}
async function loadMessages(){
 if(!current)return;
 const {data,error}=await supabase.rpc("get_private_conversation",{p_other:current,p_limit:150});if(error){alert(error.message);return}
 const stream=document.getElementById("messageStream");
 stream.innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===me?"me":""}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleString("fr-FR")}</small></div>`).join("");
 stream.scrollTop=stream.scrollHeight;
}
document.getElementById("messageForm").onsubmit=async e=>{e.preventDefault();const input=document.getElementById("messageInput");const body=input.value.trim();if(!body||!current)return;const {error}=await supabase.rpc("send_private_message",{p_recipient:current,p_body:body});if(error){alert(error.message);return}input.value="";await loadMessages();await conversations()};
supabase.channel("botm-private-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"private_messages"},payload=>{const m=payload.new;if(m.sender_id===me||m.recipient_id===me){conversations();if(current&&(m.sender_id===current||m.recipient_id===current)){loadMessages();supabase.rpc("mark_private_messages_read",{p_other:current})}}}).subscribe();
await conversations();if(current)await openConversation(current);
</script><script type="module" src="/BOTM_2.0/social.js"></script></body></html>
