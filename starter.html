<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pack de départ - BOTM</title><link rel="stylesheet" href="styles.css"></head><body><div class="app">
<div class="topbar"><div class="brand"><img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png"><div><h1>Pack de départ</h1><div class="muted">20 cartes du Multiverse</div></div></div></div>
<div class="panel"><p>Le serveur tirera tes 20 premières cartes. Ce pack ne peut être réclamé qu'une fois.</p>
<button class="btn gold" id="open">✨ Ouvrir mon pack</button><div id="msg" class="notice" style="display:none"></div><div id="cards" class="reveal-wrap"></div>
<div id="continue" style="display:none;margin-top:22px"><a class="btn" href="index.html">Entrer dans le jeu</a></div></div>
</div>
<script type="module">
import { BOTM, supabase } from "./app.js";
await BOTM.requireAuth();
const p=await BOTM.profile(); if(p.starter_claimed) location.href="index.html";
const msg=document.getElementById("msg");
document.getElementById("open").onclick=async()=>{
 const b=document.getElementById("open"); b.disabled=true; msg.style.display="block";msg.textContent="Le Multiverse choisit tes cartes...";
 const {data,error}=await supabase.rpc("claim_starter_pack");
 if(error){msg.textContent=error.message;b.disabled=false;return;}
 const wrap=document.getElementById("cards");wrap.innerHTML="";
 (data||[]).forEach((c,i)=>setTimeout(()=>{
   const d=document.createElement("div");d.className="card-item reveal";
   d.innerHTML=`<img class="card-img" src="${BOTM.imagePath(c)}"><div class="meta"><b>${c.file_name.replace(/\.[^.]+$/,"")}</b><div class="rarity">${c.universe} • ${BOTM.rarityLabel(c.rarity)}</div></div>`;
   wrap.appendChild(d);
 },i*70));
 msg.textContent="Pack réclamé ! 20 cartes ont été enregistrées sur ton compte.";
 document.getElementById("continue").style.display="block";
};
</script></body></html>
