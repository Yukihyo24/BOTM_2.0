<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raids Titans - BOTM</title>
<link rel="stylesheet" href="/BOTM_2.0/styles.css">
<style>
:root{--rt-violet:#8b5cf6;--rt-blue:#5b8cff;--rt-bg:#0b1022;--rt-panel:rgba(15,21,45,.88)}
body{min-height:100vh}
.rt{max-width:1600px;margin:0 auto;padding:14px 18px;height:100vh;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;overflow:hidden}
.rt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:0}.rt-top .btn{padding:9px 14px}
.rt-actions{display:flex;gap:10px;flex-wrap:wrap}
.rt-panel{background:linear-gradient(145deg,rgba(22,28,59,.94),rgba(10,14,31,.94));border:1px solid rgba(139,92,246,.24);border-radius:20px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.rt-stage{min-height:0;display:grid;grid-template-columns:minmax(310px,39%) minmax(0,61%);gap:18px}
.boss{display:flex;flex-direction:column;overflow:hidden;min-height:0;height:100%}
.boss-art{min-height:0;height:38%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(139,92,246,.22),transparent 55%);position:relative;overflow:hidden;padding:8px 18px 0;box-sizing:border-box}
.boss-art img{width:auto;height:auto;max-width:82%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 20px rgba(0,0,0,.42));transition:filter .2s,transform .2s}
.boss-info{padding:8px 22px 14px;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;flex:1;overflow:hidden}.boss-info h1{line-height:1;margin:2px 0;font-size:clamp(1.7rem,3vw,3rem)}.boss-info .universe{margin-bottom:10px}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;opacity:.65;font-weight:800}
.boss-info h1{font-size:clamp(2rem,5vw,4.3rem);margin:5px 0 2px}
.universe{font-weight:800;color:#b9a7ff;margin-bottom:24px}
.hp-row{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:8px}
.hpbar{height:19px;border-radius:999px;background:#080b18;border:1px solid rgba(255,255,255,.12);overflow:hidden}
.hpfill{height:100%;width:0;background:linear-gradient(90deg,#6d5dfc,#a855f7);transition:width .45s ease}
.hptext{text-align:center;font-weight:900;margin-top:5px;font-size:.92rem}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.statbox{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.statbox small{display:block;opacity:.62;margin-bottom:5px}.statbox strong{font-size:1.08rem}
.attack{font-size:1rem;padding:10px 18px;margin-top:auto}
.attack:disabled{opacity:.45;cursor:not-allowed}
#message{margin-top:12px}
.empty{padding:60px 25px;text-align:center}
.combat{padding:12px 18px 14px;display:none;min-height:0;height:100%;overflow:hidden;box-sizing:border-box}
.combat.show{display:flex;flex-direction:column;justify-content:center}
.round-head{text-align:center;margin-bottom:8px}
.round-head h2{margin:5px 0}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:7px 0}
.stat-pill{padding:9px 16px;border-radius:999px;background:rgba(139,92,246,.15);border:1px solid rgba(167,139,250,.4);font-weight:900}
.requirement{text-align:center;font-weight:800;margin:6px 0 10px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:900px;width:100%;margin:0 auto}
.raid-card{position:relative;padding:8px;border-radius:16px;background:rgba(7,10,24,.7);border:2px solid transparent;cursor:pointer;transition:.18s}
.raid-card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.55)}
.raid-card.selected{border-color:#a78bfa;box-shadow:0 0 25px rgba(139,92,246,.26)}
.raid-card img{display:block;width:100%;height:min(29vh,255px);object-fit:contain;border-radius:10px}
.card-name{font-weight:900;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.card-values{font-size:.75rem;opacity:.72;margin-top:2px;line-height:1.15}
.pickmark{position:absolute;right:15px;top:15px;width:31px;height:31px;border-radius:50%;display:none;place-items:center;background:#8b5cf6;color:white;font-weight:900}
.raid-card.selected .pickmark{display:grid}
.validate-wrap{text-align:center;margin-top:7px;flex:0 0 auto}.validate-wrap .btn{padding:9px 18px}
.result{text-align:center;margin:6px auto 0;max-width:720px;padding:7px 14px;border-radius:14px;background:rgba(139,92,246,.09);display:none}
.result.show{display:block}
.damage{font-size:1.35rem;font-weight:950}
.boss.hit{animation:titanHit .55s ease}
.boss.hit .boss-art img{animation:titanImageHit .55s ease}
.damage-pop{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:5;font-size:clamp(1.5rem,3vw,2.7rem);font-weight:950;color:white;text-shadow:0 3px 12px #000;pointer-events:none;animation:damageFloat 1.05s ease forwards}
.hpfill.hp-hit{animation:hpPulse .65s ease}
@keyframes titanHit{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes titanImageHit{0%{filter:drop-shadow(0 20px 28px rgba(0,0,0,.48));transform:scale(1)}30%{filter:brightness(2) drop-shadow(0 0 24px rgba(255,255,255,.8));transform:scale(1.025)}100%{filter:drop-shadow(0 20px 28px rgba(0,0,0,.48));transform:scale(1)}}
@keyframes damageFloat{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
@keyframes hpPulse{0%,100%{filter:none}45%{filter:brightness(1.8)}}
@media(min-width:851px) and (max-height:850px){
  .rt{padding-top:10px;padding-bottom:10px}
  .boss-art{height:35%}
  .boss-art img{max-width:76%}
  .boss-info{padding-top:5px}
  .boss-info h1{font-size:1.8rem}
  .status-grid{margin:8px 0}
  .statbox{padding:8px 10px}
  .round-head{margin-bottom:4px}
  .round-head h2{margin:2px 0;font-size:1.35rem}
  .stats{margin:4px 0}
  .stat-pill{padding:7px 13px}
  .requirement{margin:4px 0 7px}
  .raid-card{padding:6px}
  .raid-card img{height:min(27vh,225px)}
  .validate-wrap{margin-top:5px}
}
@media(max-width:850px){body{overflow:auto}.rt{height:auto;min-height:100vh;display:block;overflow:visible;padding:12px}.rt-top{margin-bottom:12px}.rt-stage{display:block}.boss{height:auto}.boss-art{height:320px}.boss-art img{max-height:310px}.boss-info{padding:22px}.combat{height:auto;overflow:visible;margin-top:14px}.cards{grid-template-columns:repeat(2,1fr)}.raid-card img{height:auto;aspect-ratio:2/3}.status-grid{grid-template-columns:1fr}}
</style>

<style>
/* Phase 6 — récupération des récompenses */
.reward-overlay{position:fixed;inset:0;z-index:1000;background:rgba(2,5,15,.88);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}
.reward-overlay.show{display:grid}
.reward-box{width:min(620px,94vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#151a35,#0b1024);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.55)}

<body>
<div class="rt">
  <div class="rt-top">
    <a class="btn" href="/BOTM_2.0/index.html">← Accueil</a>
    <div class="rt-actions">
      <a class="btn" href="/BOTM_2.0/titan-deck.html">🃏 Modifier mon deck Titan</a>
    </div>
  </div>

  <div class="rt-stage">
  <section id="bossPanel" class="rt-panel boss" style="display:none">
    <div class="boss-art"><img id="bossImage" alt=""></div>
    <div class="boss-info">
      <div class="eyebrow">Raid Titan en cours</div>
      <h1 id="bossName">Titan</h1>
      <div id="bossUniverse" class="universe"></div>

      <div class="hp-row"><span>PV DU TITAN</span><span id="hpPercent">100 %</span></div>
      <div class="hpbar"><div id="hpFill" class="hpfill"></div></div>
      <div id="hpText" class="hptext"></div>

      <div class="status-grid">
        <div class="statbox"><small>Temps restant</small><strong id="timeLeft">--</strong></div>
        <div class="statbox"><small>Essais</small><strong id="attempts">-- / 5</strong><div id="recharge" class="muted"></div></div>
        <div class="statbox"><small>Deck Titan</small><strong id="deckState">-- / 20</strong></div>
      </div>

      <button id="attackBtn" class="btn gold attack">⚔️ Attaquer le Titan</button>
      <div id="message" class="notice" style="display:none"></div>
    </div>
  </section>

  <section id="emptyPanel" class="rt-panel empty" style="display:none">
    <h1>Aucun Titan actif</h1>
    <p id="emptyText" class="muted">Aucun Raid Titan n'est disponible actuellement.</p>
  </section>

  <section id="combatPanel" class="rt-panel combat">
    <div class="round-head">
      <div class="eyebrow">Tentative en cours</div>
      <h2 id="roundTitle">Round 1 / 3</h2>
      <div class="stats"><span id="stat1" class="stat-pill"></span><span id="stat2" class="stat-pill"></span></div>
    </div>
    <div id="requirement" class="requirement"></div>
    <div id="roundCards" class="cards"></div>
    <div class="validate-wrap"><button id="validateBtn" class="btn gold" disabled>Valider mes cartes</button></div>
    <div id="roundResult" class="result"></div>
  </section>
  </div>
</div>


<div id="rewardOverlay" class="reward-overlay">
  <div class="reward-box">
    <div class="eyebrow">Récompense Raid Titan</div>
    <h2 id="rewardTitle">🎁 Récompense disponible</h2>
    <div id="rewardSub" class="reward-sub"></div>
    <div id="rewardItems" class="reward-items"></div>
    <div id="rewardBonusCard" class="reward-card"></div>
    <div id="rewardNote" class="reward-note"></div>
    <div class="reward-actions">
      <button id="claimRewardBtn" class="btn gold">🎁 Récupérer mes récompenses</button>
      <button id="closeRewardBtn" class="btn" style="display:none">Fermer</button>
    </div>
  </div>
</div>

<script type="module">
import {BOTM,supabase} from "/BOTM_2.0/app.js";
await BOTM.requireAuth();

const $=id=>document.getElementById(id);
let raid=null,attemptId=null,currentRound=null,selected=[],busy=false;
let timer=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function cardName(c){return String(c.file_name||"").replace(/\.[^.]+$/,"");}
function n(v){return Number(v||0).toLocaleString("fr-FR");}

let pendingReward=null;

function rewardItemsHtml(r){
  const items=[];
  if(Number(r.points)>0) items.push(`<div class="reward-item">💰 Points<b>${n(r.points)}</b></div>`);
  if(Number(r.boosters)>0) items.push(`<div class="reward-item">🎁 Booster<b>× ${n(r.boosters)}</b></div>`);
  if(Number(r.miracle_draws)>0) items.push(`<div class="reward-item">✨ Pioche Miracle<b>× ${n(r.miracle_draws)}</b></div>`);
  return items.join("");
}

async function checkTitanReward(){
  const {data,error}=await supabase.rpc("get_titan_pending_reward");
  if(error){console.error("Récompense Titan :",error);return;}
  if(!data?.pending)return;
  pendingReward=data;
  $("rewardTitle").textContent=data.reward_type==="victory"?"🏆 Titan vaincu !":"⏱️ Raid Titan terminé";
  $("rewardSub").textContent=`${data.titan_name} · ${data.titan_universe}`;
  $("rewardItems").innerHTML=rewardItemsHtml(data);
  $("rewardBonusCard").classList.remove("show");
  $("rewardBonusCard").innerHTML="";
  $("rewardNote").textContent=data.reward_type==="victory"
    ?"Une carte de l'univers du Titan peut également être gagnée avec 3 % de chance."
    :`Dégâts collectifs : ${n(data.collective_damage)} PV`;
  $("claimRewardBtn").style.display="";
  $("claimRewardBtn").disabled=false;
  $("claimRewardBtn").textContent="🎁 Récupérer mes récompenses";
  $("closeRewardBtn").style.display="none";
  $("rewardOverlay").classList.add("show");
}

$("claimRewardBtn").onclick=async()=>{
  if(!pendingReward)return;
  const btn=$("claimRewardBtn");
  btn.disabled=true;btn.textContent="Récupération…";
  const {data,error}=await supabase.rpc("claim_titan_reward",{p_raid_id:pendingReward.raid_id});
  if(error){btn.disabled=false;btn.textContent="🎁 Récupérer mes récompenses";$("rewardNote").textContent=error.message;return;}

  $("rewardTitle").textContent="🎉 Récompenses récupérées !";
  $("rewardItems").innerHTML=rewardItemsHtml(data);

  if(data.bonus_card){
    const c=data.bonus_card;
    $("rewardBonusCard").classList.add("show");
    $("rewardBonusCard").innerHTML=`
      <div class="eyebrow">✨ Carte bonus obtenue !</div>
      <img src="${BOTM.imagePath(c)}" alt="${esc(cardName(c))}">
      <strong>${esc(cardName(c))}</strong>
      <div class="muted">${esc(BOTM.rarityLabel(c.rarity))} · ${esc(c.universe)}</div>`;
    $("rewardNote").textContent="Les 3 % ont réussi : la carte a été ajoutée à ta collection.";
  }else{
    $("rewardBonusCard").classList.remove("show");
    $("rewardNote").textContent=data.reward_type==="victory"
      ?"Pas de carte bonus cette fois-ci."
      :"Récompense ajoutée à ton profil.";
  }

  btn.style.display="none";
  $("closeRewardBtn").style.display="";
  pendingReward=null;
  try{await BOTM.refreshHeader();}catch(e){}
};

$("closeRewardBtn").onclick=()=>{$("rewardOverlay").classList.remove("show");};

function dateMs(v){const d=new Date(v);return Number.isNaN(d.getTime())?null:d.getTime();}
function bossPath(path){if(!path)return "";if(/^https?:\/\//i.test(path))return path;return new URL(String(path).replace(/^\/+/,""),location.origin+"/BOTM_2.0/").href;}

function countdown(target){
  const ms=dateMs(target);
  if(!ms)return "--";
  const d=Math.max(0,ms-Date.now());
  const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function startClock(){
  clearInterval(timer);
  const tick=()=>{
    if(raid?.active)$("timeLeft").textContent=countdown(raid.ends_at);
    if(raid?.next_recharge_at && Number(raid.attempts)<5)
      $("recharge").textContent=`Prochain essai : ${countdown(raid.next_recharge_at)}`;
    else $("recharge").textContent="";
  };
  tick();timer=setInterval(tick,1000);
}

function updateBossHp(current,max){
  current=Number(current||0);max=Number(max||1);
  const pct=Math.max(0,Math.min(100,(current/max)*100));
  $("hpFill").style.width=pct+"%";
  $("hpPercent").textContent=pct.toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
  $("hpText").textContent=`${n(current)} / ${n(max)} PV`;
}

function animateTitanDamage(amount){
  const boss=$("bossPanel"),art=boss.querySelector(".boss-art"),fill=$("hpFill");
  boss.classList.remove("hit");fill.classList.remove("hp-hit");
  void boss.offsetWidth;
  boss.classList.add("hit");fill.classList.add("hp-hit");
  const pop=document.createElement("div");
  pop.className="damage-pop";
  pop.textContent=`-${n(amount)} PV`;
  art.appendChild(pop);
  setTimeout(()=>{boss.classList.remove("hit");fill.classList.remove("hp-hit");pop.remove();},1100);
}

function showMessage(text){
  $("message").style.display="block";$("message").textContent=text;
}
function hideMessage(){$("message").style.display="none";}

function refreshAttackButton(){
  if(!raid?.active)return;
  const ready=Boolean(raid.deck_ready);
  const attempts=Number(raid.attempts||0);
  $("attackBtn").disabled=busy || !ready || (attempts<=0 && !attemptId);
  if(!ready)showMessage("Ton deck Titan doit contenir 20 cartes avant de pouvoir attaquer.");
  else if(attempts<=0 && !attemptId)showMessage("Tu n'as plus d'essai disponible pour le moment.");
  else hideMessage();
}

async function loadLobby(){
  const {data,error}=await supabase.rpc("get_titan_raid_status");
  if(error){$("emptyPanel").style.display="block";$("emptyText").textContent=error.message;return;}
  raid=data||{};
  if(!raid.active){
    $("bossPanel").style.display="none";$("emptyPanel").style.display="block";
    $("emptyText").textContent=raid.paused
      ? `Les Raids Titans sont actuellement en pause${raid.pause_ends_at?` jusqu'au ${new Date(raid.pause_ends_at).toLocaleString("fr-FR")}`:""}.`
      :"Aucun Raid Titan n'est disponible actuellement.";
    return;
  }
  $("emptyPanel").style.display="none";$("bossPanel").style.display="grid";
  $("bossName").textContent=raid.name||"Titan";
  $("bossUniverse").textContent=raid.universe||"";
  $("bossImage").src=bossPath(raid.image_path);
  $("bossImage").alt=raid.name||"Titan";
  $("attempts").textContent=`${raid.attempts ?? 0} / ${raid.attempts_max ?? 5}`;
  $("deckState").textContent=`${raid.deck_count ?? 0} / 20`;
  updateBossHp(raid.current_hp,raid.max_hp);
  startClock();
  refreshAttackButton();

  const {data:open,error:openError}=await supabase.rpc("get_open_titan_attempt");
  if(!openError && open?.open){
    attemptId=open.attempt_id;
    renderRound(open.round);
    $("attackBtn").textContent="⚔️ Reprendre ma tentative";
    $("attackBtn").disabled=false;
  }
}

function statValue(c,stat){
  const key={"Physique":"physique","Pouvoirs":"pouvoirs","Vitesse":"vitesse"}[stat];
  return Number(c?.[key]||0);
}

function renderRound(round){
  if(!round)return;
  currentRound=round;selected=[];
  $("combatPanel").classList.add("show");
  $("roundTitle").textContent=`Round ${round.round_number} / 3`;
  $("stat1").textContent=round.stat_1;
  $("stat2").textContent=round.stat_2;
  $("requirement").textContent=`Sélectionne exactement ${round.required_cards} carte${Number(round.required_cards)>1?"s":""} parmi les 4 proposées.`;
  $("roundResult").classList.remove("show");
  $("roundResult").innerHTML="";
  $("validateBtn").disabled=true;
  $("validateBtn").textContent="Valider mes cartes";

  $("roundCards").innerHTML=(round.cards||[]).map(c=>`
    <div class="raid-card" data-id="${c.id}">
      <div class="pickmark">✓</div>
      <img src="${BOTM.imagePath(c)}" alt="${esc(cardName(c))}">
      <div class="card-name">${esc(cardName(c))}</div>
      <div class="card-values">${esc(round.stat_1)} ${statValue(c,round.stat_1)} · ${esc(round.stat_2)} ${statValue(c,round.stat_2)} · Valeur ${n(c.valeur)}</div>
    </div>`).join("");

  $("roundCards").querySelectorAll(".raid-card").forEach(el=>{
    el.onclick=()=>{
      if(busy)return;
      const id=Number(el.dataset.id),i=selected.indexOf(id);
      if(i>=0)selected.splice(i,1);
      else{
        if(selected.length>=Number(currentRound.required_cards))return;
        selected.push(id);
      }
      $("roundCards").querySelectorAll(".raid-card").forEach(x=>x.classList.toggle("selected",selected.includes(Number(x.dataset.id))));
      $("validateBtn").disabled=selected.length!==Number(currentRound.required_cards);
    };
  });

}

$("attackBtn").onclick=async()=>{
  if(busy)return;
  if(attemptId && currentRound){return;}
  busy=true;refreshAttackButton();
  const {data,error}=await supabase.rpc("start_titan_attempt");
  busy=false;
  if(error){showMessage(error.message);refreshAttackButton();return;}
  attemptId=data.attempt_id;
  if(!data.resumed && data.attempts_left!==undefined){
    raid.attempts=data.attempts_left;
    raid.next_recharge_at=data.next_recharge_at;
    $("attempts").textContent=`${raid.attempts} / 5`;
  }
  $("attackBtn").textContent="⚔️ Tentative en cours";
  renderRound(data.round);
  refreshAttackButton();
};

$("validateBtn").onclick=async()=>{
  if(busy || !attemptId || !currentRound)return;
  busy=true;$("validateBtn").disabled=true;$("validateBtn").textContent="Calcul des dégâts…";
  const {data,error}=await supabase.rpc("play_titan_round",{p_attempt_id:attemptId,p_card_ids:selected});
  busy=false;
  if(error){$("roundResult").classList.add("show");$("roundResult").textContent=error.message;$("validateBtn").disabled=false;$("validateBtn").textContent="Valider mes cartes";return;}

  animateTitanDamage(data.round_damage);
  setTimeout(()=>updateBossHp(data.titan_current_hp,data.titan_max_hp),180);
  raid.current_hp=data.titan_current_hp;raid.max_hp=data.titan_max_hp;
  $("roundResult").classList.add("show");
  $("roundResult").innerHTML=`<div>Round ${data.round_number} terminé</div><div class="damage">⚔️ ${n(data.round_damage)} dégâts</div><div class="muted">Total de la tentative : ${n(data.attempt_total_damage)}</div>`;

  if(data.titan_defeated){
    attemptId=null;currentRound=null;
    $("validateBtn").style.display="none";
    $("roundResult").innerHTML+=`<h2>🏆 Titan vaincu !</h2>`;
    $("attackBtn").disabled=true;
    clearInterval(timer);
    return;
  }

  if(data.attempt_completed){
    attemptId=null;currentRound=null;
    $("validateBtn").style.display="none";
    $("roundResult").innerHTML+=`<h3>Tentative terminée</h3>`;
    setTimeout(async()=>{
      $("combatPanel").classList.remove("show");
      $("validateBtn").style.display="";
      $("attackBtn").textContent="⚔️ Attaquer le Titan";
      await loadLobby();
    },2200);
    return;
  }

  setTimeout(()=>renderRound(data.next_round),1300);
};

await loadLobby();
await checkTitanReward();
</script>
<script type="module" src="/BOTM_2.0/social.js"></script>
