<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes Decks Duel — BOTM</title><link rel="stylesheet" href="/BOTM_2.0/styles.css"><style>
body{background:#070b1d;color:#f5f7ff;margin:0;font-family:Inter,system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:26px}.top,.decktabs,.manage{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.back{color:#bbb;text-decoration:none}.hero,.panel{background:#0e132c;border:1px solid #292d51;border-radius:22px;padding:20px}.hero{margin:20px 0;background:linear-gradient(135deg,#241b57aa,#0e132c)}.hero h1{font-size:44px;margin:4px 0}.hero span{color:#aa8cff}.decktabs{overflow-x:auto;margin-bottom:15px}.tab,.new,.manage button{border:1px solid #383e68;background:#111733;color:#ddd;padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:800}.tab.active{background:#2a205d;border-color:#987eff;color:white}.new{color:#aa91ff}.manage{margin:0 0 14px}.layout{display:grid;grid-template-columns:1fr 2fr;gap:18px}.meters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.meter{background:#151b3a;padding:9px 12px;border-radius:10px;font-weight:900}.ok{color:#62e6a4}.bad{color:#ff7898}.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.deck article,.cards article{position:relative;background:#121936;border:1px solid #33385e;border-radius:12px;overflow:hidden}.deck img,.cards img{width:100%;display:block}.deck button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;background:#a32c52;color:#fff;width:28px;height:28px}.slot{position:absolute;left:4px;top:4px;background:#080c1ddd;padding:4px 7px;border-radius:7px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{padding:10px;background:#090f26;color:#fff;border:1px solid #363b62;border-radius:9px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:72vh;overflow:auto}.cards article{cursor:pointer}.cards article.in{opacity:.3;cursor:default}.meta{padding:7px}.meta b,.meta small{display:block}.meta small{color:#aaa}.stats{font-size:10px;margin-top:4px}.notice{margin:12px 0;padding:10px;background:#171d3d;border-radius:10px}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.deck{grid-template-columns:repeat(5,1fr)}}@media(max-width:550px){main{padding:12px}.deck{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><div class="top"><a class="back" href="/BOTM_2.0/collection.html">← Collection</a><b id="global">Mes decks</b></div>
<section class="hero"><small>DUELS BOTM</small><h1>Mes <span>Decks Duel</span></h1><p>Crée jusqu'à <b>5 decks</b>. Pour être jouable, un deck doit contenir exactement <b>40 cartes</b> et ne pas dépasser <b>4000 de Valeur cumulée</b>.</p></section>
<div id="msg" class="notice hidden"></div><div id="tabs" class="decktabs"></div>
<div id="editor" class="hidden"><div class="manage"><button id="rename">✎ Renommer</button><button id="delete">🗑 Supprimer</button></div>
<div class="layout"><section class="panel"><h2 id="deckname">Deck</h2><div class="meters"><div id="count" class="meter">0 / 40 cartes</div><div id="value" class="meter">Valeur 0 / 4000</div><div id="ready" class="meter bad">Deck incomplet</div></div><div id="deck" class="deck"></div></section>
<section class="panel"><h2>🃏 Ma collection</h2><div class="filters"><select id="u"><option value="">Tous les univers</option></select><select id="r"><option value="">Toutes les raretés</option><option value="commune">Commune</option><option value="rare">Rare</option><option value="super_rare">Super Rare</option><option value="tres_rare">Très Rare</option><option value="ultra_rare">Ultra Rare</option></select><input id="q" placeholder="Rechercher…"></div><div id="cards" class="cards"></div></section></div></div>
</main><script type="module">
import {BOTM,supabase} from "/BOTM_2.0/app.js";await BOTM.requireAuth();const $=s=>document.querySelector(s);let decks=[],active=null,all=[];
async function rpc(n,a={}){const {data,error}=await supabase.rpc(n,a);if(error)throw error;return data}const nm=c=>c.file_name.replace(/\.[^.]+$/,"");
function msg(t){$("#msg").textContent=t;$("#msg").classList.remove("hidden");setTimeout(()=>$("#msg").classList.add("hidden"),2600)}
async function loadDecks(){decks=await rpc("get_duel_decks");$("#global").textContent=`Mes decks ${decks.length}/5`;renderTabs();if(active&&!decks.some(d=>d.id===active))active=null;if(!active&&decks.length)active=decks[0].id;if(active)await loadActive();else $("#editor").classList.add("hidden")}
function renderTabs(){$("#tabs").innerHTML=decks.map(d=>`<button class="tab ${d.id===active?"active":""}" data-id="${d.id}">${d.name} · ${d.card_count}/40</button>`).join("")+(decks.length<5?'<button class="new" id="new">＋ Nouveau deck</button>':'');document.querySelectorAll(".tab").forEach(x=>x.onclick=async()=>{active=+x.dataset.id;renderTabs();await loadActive()});if($("#new"))$("#new").onclick=async()=>{const n=prompt("Nom du nouveau Deck Duel :");if(!n)return;try{active=await rpc("create_duel_deck",{p_name:n});await loadDecks()}catch(e){msg(e.message)}}}
async function loadActive(){all=await rpc("get_duel_deck_collection",{p_deck_id:active});const d=decks.find(x=>x.id===active);$("#editor").classList.remove("hidden");$("#deckname").textContent=d.name;$("#count").textContent=`${d.card_count} / 40 cartes`;$("#value").textContent=`Valeur ${d.total_value} / 4000`;$("#count").className="meter "+(d.card_count===40?"ok":"bad");$("#value").className="meter "+(d.total_value<=4000?"ok":"bad");$("#ready").textContent=d.is_ready?"✓ Deck valide":"Deck non valide";$("#ready").className="meter "+(d.is_ready?"ok":"bad");fillU();renderDeck();renderCards()}
function fillU(){const cur=$("#u").value;$("#u").innerHTML='<option value="">Tous les univers</option>'+[...new Set(all.map(c=>c.universe))].sort().map(x=>`<option>${x}</option>`).join("");$("#u").value=cur}
function renderDeck(){const a=all.filter(c=>c.in_deck).sort((a,b)=>a.slot-b.slot);$("#deck").innerHTML=a.map(c=>`<article><span class="slot">${c.slot}</span><button data-x="${c.card_id}">×</button><img src="${BOTM.imagePath(c)}"></article>`).join("");document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{try{await rpc("remove_duel_deck_card",{p_deck_id:active,p_card_id:+b.dataset.x});await loadDecks()}catch(e){msg(e.message)}})}
function renderCards(){const u=$("#u").value,r=$("#r").value,q=$("#q").value.toLowerCase();const a=all.filter(c=>(!u||c.universe===u)&&(!r||c.rarity===r)&&(!q||(nm(c)+" "+(c.character_name||"")).toLowerCase().includes(q)));$("#cards").innerHTML=a.map(c=>`<article class="${c.in_deck?"in":""}" data-a="${c.card_id}"><img src="${BOTM.imagePath(c)}"><div class="meta"><b>${nm(c)}</b><small>${c.universe} · ${BOTM.rarityLabel(c.rarity)}</small><div class="stats">PHY ${c.physique} · POU ${c.pouvoirs} · VIT ${c.vitesse} · VAL ${c.valeur}</div></div></article>`).join("");document.querySelectorAll("#cards article:not(.in)").forEach(e=>e.onclick=async()=>{try{await rpc("add_duel_deck_card",{p_deck_id:active,p_card_id:+e.dataset.a});await loadDecks()}catch(x){msg(x.message)}})}
$("#u").onchange=renderCards;$("#r").onchange=renderCards;$("#q").oninput=renderCards;
$("#rename").onclick=async()=>{const d=decks.find(x=>x.id===active),n=prompt("Nouveau nom :",d.name);if(!n)return;try{await rpc("rename_duel_deck",{p_deck_id:active,p_name:n});await loadDecks()}catch(e){msg(e.message)}};
$("#delete").onclick=async()=>{if(!confirm("Supprimer ce Deck Duel ?"))return;try{await rpc("delete_duel_deck",{p_deck_id:active});active=null;await loadDecks()}catch(e){msg(e.message)}};
loadDecks().catch(e=>msg("Erreur : "+e.message));
</script></body></html>
