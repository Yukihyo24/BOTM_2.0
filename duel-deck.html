<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck Duel — BOTM</title><link rel="stylesheet" href="/BOTM_2.0/styles.css"><style>
body{background:#070b1d;color:#f5f7ff;margin:0;font-family:Inter,system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#bbb;text-decoration:none}.hero,.panel{background:#0e132c;border:1px solid #292d51;border-radius:22px;padding:20px}.hero{margin:22px 0;background:linear-gradient(135deg,#241b57aa,#0e132c)}.hero h1{font-size:45px;margin:5px 0}.hero span{color:#a98cff}.count{font-size:25px;font-weight:900}.ok{color:#65e6a5}.bad{color:#ff7898}.layout{display:grid;grid-template-columns:1fr 2fr;gap:18px}.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.deck article,.cards article{position:relative;background:#121936;border:1px solid #33385e;border-radius:12px;overflow:hidden}.deck img,.cards img{width:100%;display:block}.deck button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;background:#a32c52;color:#fff;width:28px;height:28px}.slot{position:absolute;left:4px;top:4px;background:#080c1ddd;padding:4px 7px;border-radius:7px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{padding:10px;background:#090f26;color:#fff;border:1px solid #363b62;border-radius:9px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:72vh;overflow:auto}.cards article{cursor:pointer}.cards article.in{opacity:.3;cursor:default}.meta{padding:7px}.meta b,.meta small{display:block}.meta small{color:#aaa}.stats{font-size:10px;margin-top:4px}.notice{margin:12px 0;padding:10px;background:#171d3d;border-radius:10px}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.deck{grid-template-columns:repeat(5,1fr)}}@media(max-width:550px){main{padding:12px}.deck{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><div class="top"><a class="back" href="/BOTM_2.0/collection.html">← Collection</a><div id="count" class="count">0 / 40</div></div>
<section class="hero"><small>DUELS BOTM</small><h1>Mon <span>Deck Duel</span></h1><p>Choisis exactement <b>40 cartes différentes</b> de ta collection. Elles constitueront ton équipe permanente pour les futurs duels.</p></section><div id="msg" class="notice hidden"></div>
<div class="layout"><section class="panel"><h2>⚔️ Mon deck</h2><p id="state"></p><div id="deck" class="deck"></div></section><section class="panel"><h2>🃏 Ma collection</h2><div class="filters"><select id="u"><option value="">Tous les univers</option></select><select id="r"><option value="">Toutes les raretés</option><option value="commune">Commune</option><option value="rare">Rare</option><option value="super_rare">Super Rare</option><option value="tres_rare">Très Rare</option><option value="ultra_rare">Ultra Rare</option></select><input id="q" placeholder="Rechercher…"></div><div id="cards" class="cards"></div></section></div></main>
<script type="module">import {BOTM,supabase} from "/BOTM_2.0/app.js";await BOTM.requireAuth();const $=s=>document.querySelector(s);let all=[];
async function rpc(n,a={}){const {data,error}=await supabase.rpc(n,a);if(error)throw error;return data}const nm=c=>c.file_name.replace(/\.[^.]+$/,"");function message(t){$("#msg").textContent=t;$("#msg").classList.remove("hidden");setTimeout(()=>$("#msg").classList.add("hidden"),2200)}
async function load(){all=await rpc("get_duel_deck_collection");const n=all.filter(c=>c.in_deck).length;$("#count").textContent=`${n} / 40`;$("#count").className="count "+(n===40?"ok":"bad");$("#state").innerHTML=n===40?"<b>Deck prêt !</b>":`Encore <b>${40-n}</b> carte(s) à sélectionner.`;const cur=$("#u").value;$("#u").innerHTML='<option value="">Tous les univers</option>'+[...new Set(all.map(c=>c.universe))].sort().map(x=>`<option>${x}</option>`).join("");$("#u").value=cur;deck();cards()}
function deck(){const a=all.filter(c=>c.in_deck).sort((a,b)=>a.slot-b.slot);$("#deck").innerHTML=a.map(c=>`<article><span class="slot">${c.slot}</span><button data-x="${c.card_id}">×</button><img src="${BOTM.imagePath(c)}"></article>`).join("");document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{try{await rpc("remove_duel_deck_card",{p_card_id:+b.dataset.x});await load()}catch(e){message(e.message)}})}
function cards(){const u=$("#u").value,r=$("#r").value,q=$("#q").value.toLowerCase();const a=all.filter(c=>(!u||c.universe===u)&&(!r||c.rarity===r)&&(!q||(nm(c)+" "+(c.character_name||"")).toLowerCase().includes(q)));$("#cards").innerHTML=a.map(c=>`<article class="${c.in_deck?"in":""}" data-a="${c.card_id}"><img src="${BOTM.imagePath(c)}"><div class="meta"><b>${nm(c)}</b><small>${c.universe} · ${BOTM.rarityLabel(c.rarity)}</small><div class="stats">PHY ${c.physique} · POU ${c.pouvoirs} · VIT ${c.vitesse} · VAL ${c.valeur}</div></div></article>`).join("");document.querySelectorAll("#cards article:not(.in)").forEach(e=>e.onclick=async()=>{try{await rpc("add_duel_deck_card",{p_card_id:+e.dataset.a});await load()}catch(x){message(x.message)}})}
$("#u").onchange=cards;$("#r").onchange=cards;$("#q").oninput=cards;load().catch(e=>message(e.message));</script></body></html>
