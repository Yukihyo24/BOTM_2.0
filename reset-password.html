<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveau mot de passe - BOTM</title><link rel="stylesheet" href="/BOTM_2.0/styles.css"></head>
<body><div class="app"><div class="form panel">
<div class="brand"><img src="https://i83.servimg.com/u/f83/19/48/18/17/logo10.png" alt="BOTM"><div><h1>Battle of the Multiverse</h1><div class="muted">Réinitialisation du mot de passe</div></div></div>
<hr>
<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Nouveau mot de passe">
<input id="password-confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Confirmer le nouveau mot de passe">
<button class="btn gold" id="submit">Modifier mon mot de passe</button>
<div id="msg" class="notice" style="display:none"></div>
</div></div>
<script type="module">
import { supabase } from "/BOTM_2.0/app.js";

const msg=document.getElementById("msg");
const submit=document.getElementById("submit");

submit.onclick=async()=>{
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("password-confirm").value;
 msg.style.display="block";

 if(password.length<6){
   msg.textContent="Le mot de passe doit contenir au moins 6 caractères.";
   return;
 }
 if(password!==confirm){
   msg.textContent="Les deux mots de passe ne correspondent pas.";
   return;
 }

 submit.disabled=true;
 msg.textContent="Modification du mot de passe...";

 const {error}=await supabase.auth.updateUser({password});

 if(error){
   msg.textContent=error.message;
   submit.disabled=false;
   return;
 }

 msg.textContent="Mot de passe modifié. Redirection vers BOTM...";
 await supabase.auth.signOut();
 setTimeout(()=>location.href="/BOTM_2.0/login.html",1200);
};
</script></body></html>
